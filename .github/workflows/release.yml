name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# Opt the bundled JS actions into the Node 24 runtime ahead of GitHub forcing it
# (Node 20 action runtime is deprecated).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The banner prints package.json's version, so take it from the tag
      # (v3.2.0 -> 3.2.0). Only the build sees this; nothing is committed.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Build
        run: npm run build

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/easy-floorplan-card.js
